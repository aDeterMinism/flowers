<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0ede5"><title>花园管理</title><link rel="stylesheet" href="admin.css">
</head>
<body>
  <section class="login-view" id="loginView">
    <a href="/" class="back-link">← 回到花园</a>
    <form class="login-card" id="loginForm"><div class="seal">✦</div><p>月光花园</p><h1>花园管理</h1><label>管理口令<input id="password" type="password" autocomplete="current-password" autofocus></label><button>进入罗盘</button><span id="loginError"></span></form>
  </section>
  <div class="admin-app" id="adminApp" hidden>
    <aside class="sidebar"><a class="side-brand" href="/"><span>✦</span><b>月光<br>花园</b></a><nav><button class="active" data-tab="overview">概览</button><button data-tab="flowers">花朵</button><button data-tab="privacy">隐私与密钥</button><button data-tab="mail">回信</button><button data-tab="records">采集记录</button></nav><button id="logout" class="logout">退出</button></aside>
    <main class="content">
      <header><div><p>GARDEN CONSOLE</p><h1 id="pageTitle">花园概览</h1></div><div class="header-actions"><span class="save-state" id="saveState"></span><a href="/" target="_blank">预览花园 ↗</a><button id="saveConfig">保存配置</button></div></header>
      <section class="tab active" id="overviewTab"><div class="metrics"><article><span>花朵总数</span><strong id="totalCount">0</strong><small>FLOWERS</small></article><article><span>已被摘走</span><strong id="pickedCount">0</strong><small>PICKED</small></article><article><span>仍在花园</span><strong id="remainCount">0</strong><small>REMAINING</small></article></div><div class="panel"><p class="kicker">基础设置</p><div class="settings-grid"><label>花园名字<input id="gardenNameInput"></label><label class="wide">入口邀请语<textarea id="invitationInput"></textarea></label></div></div></section>
      <section class="tab" id="flowersTab"><div class="section-head"><div><p class="kicker">每一朵都是独立实例</p><h2>花朵与文案</h2></div><button id="addFlower" class="ghost">＋ 添加一朵</button></div><div id="flowerEditor" class="flower-editor"></div></section>
      <section class="tab" id="privacyTab"><div class="panel"><p class="kicker">端到端加密</p><h2>服务器只保存公钥</h2><p class="explain">在这里生成密钥对。公钥会随配置保存；私钥会立刻下载到你的设备，绝不会上传。请妥善备份，丢失后历史密文无法恢复。</p><div class="key-actions"><button id="generateKeys">生成新密钥对并下载私钥</button><label class="upload-button">选择已有公钥<input id="publicKeyFile" type="file" accept=".pem,.txt"></label></div><label>当前 RSA 公钥<textarea id="publicKeyInput" class="code" rows="9" placeholder="-----BEGIN PUBLIC KEY-----"></textarea></label><div class="settings-grid toggles"><label><input id="allowPlainMessage" type="checkbox">允许访客选择明文公开留言</label><label><input id="allowPlainEmail" type="checkbox">允许访客明文提供邮箱并触发回信</label></div></div></section>
      <section class="tab" id="mailTab"><div class="panel"><p class="kicker">SMTP 自动回信</p><div class="settings-grid"><label>SMTP 主机<input id="smtpHost" placeholder="smtp.example.com"></label><label>端口<input id="smtpPort" type="number"></label><label>用户名<input id="smtpUsername"></label><label>密码<input id="smtpPassword" type="password"></label><label>发件人<input id="smtpFrom" placeholder="花园主人 <hello@example.com>"></label><label class="toggle-line"><input id="smtpSecure" type="checkbox" checked disabled>TLS 直连（强制，通常使用 465）</label><label>邮件主题<input id="mailSubject"></label><label class="wide">邮件正文<textarea id="mailTemplate" rows="9"></textarea><small>可使用 {{flower}} 代入花名</small></label></div></div></section>
      <section class="tab" id="recordsTab"><div class="section-head"><div><p class="kicker">服务器密文仓库</p><h2>摘花记录</h2></div><div class="record-actions"><label class="upload-button">本地载入私钥<input id="privateKeyFile" type="file" accept=".json"></label><a class="button-link" href="/api/admin/export">导出全部</a></div></div><p class="explain key-status" id="keyStatus">尚未载入私钥。明文留言仍可见，其余信息需要在浏览器本地解密。</p><div id="recordsList" class="records-list"></div></section>
    </main>
  </div>
  <dialog id="recordDialog"><div class="record-modal"><button class="dialog-close">×</button><p class="kicker">本地解密结果</p><h2 id="recordTitle"></h2><pre id="recordData"></pre></div></dialog>
  <script src="admin.js" defer></script>
</body>
</html>
